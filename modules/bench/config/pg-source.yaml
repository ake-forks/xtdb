# Node config for the pg-source-tx-overhead bench (xtdb.bench.pg-source-tx-overhead).
# Registers the docker-compose Postgres (`docker-compose up postgres`) as a remote, so the
# attached source database can reference it via `remote: pg`.
# This and the bench's own --pg-url have to name the same server - the source reads the
# upstream from here, the bench's writes go through the flag.
# The node's own log/storage are left as the in-memory defaults - the attached source
# database is what the bench measures.
remotes:
  pg: !Postgres
    hostname: localhost
    port: 5433
    database: postgres
    username: postgres
    password: postgres
